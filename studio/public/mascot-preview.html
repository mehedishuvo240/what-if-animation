<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mascot Reference Sheet</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #14101C; color: #F6EFE3; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
  header { padding: 16px; border-bottom: 1px solid #3A3446; }
  h1 { margin: 0; font-size: 20px; letter-spacing: 2px; color: #FFD96A; }
  p.sub { margin: 4px 0 0; font-size: 13px; color: #B9C4D6; }
  main { flex: 1; overflow: auto; padding: 12px; display: flex; justify-content: center; align-items: flex-start; }
  svg { max-width: 100vw; max-height: 100vh; display: block; height: auto; width: auto; }
  footer { padding: 12px; font-size: 12px; color: #8C94A6; border-top: 1px solid #3A3446; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>MASCOT REFERENCE SHEET</h1>
  <p class="sub">Original character · Consistent across every scene · Self-contained (no external resources)</p>
</header>
<main>
  <object type="image/svg+xml" data="mascot-sheet.svg" style="width:100vw;height:100vh;"></object>
</main>
<footer>
  Front &bull; Side (left) &bull; Side (right) &bull; Back &bull; Expressions: neutral, happy, shock, worried, smug, oops, cool, tired
</footer>
</body>
</html>
